include "../../seattle-pilates-base.conf"

beam.agentsim.simulationName = "sfbay-pilates-network"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.33 # 10% sincewe are simulating 30% of seattle population
beam.agentsim.lastIteration = 0

beam.warmStart.type = ""
beam.warmStart.path = ""
beam.warmStart.initialLinkstatsFilePath = ""
beam.warmStart.prepareData = true

beam.physsim.flowCapacityFactor = 0.09
#beam.physsim.storageCapacityFactor = 0.5
beam.physsim.storageCapacityFactor = 1.0
beam.physsim.name = "JDEQSim"

# The following parameters control the number of lanes in short links, which is the primary method to manage storage capacity in links in beam.
# The override is activated when minimumLinkLengthThreshold is greater than 0.
beam.physsim.jdeqsim.shortLink.storageCapacityOverride {
    minimumLinkLengthThreshold = 10.0  # Minimum length threshold (greater than 0) to activate lane override.
    overriddenNumLanesPerLink = 50.0  # Number of lanes to use when overriding the default configuration for short links.
}

beam.physsim.network.overwriteRoadTypeProperties.enabled = true
#Freeway
beam.physsim.network.overwriteRoadTypeProperties.motorway.speed = 31.2928
#Freeway-to-Freeway Connector
beam.physsim.network.overwriteRoadTypeProperties.motorwayLink.speed = 30.3
beam.physsim.network.overwriteRoadTypeProperties.motorwayLink.capacity = 4000
#Expressway
beam.physsim.network.overwriteRoadTypeProperties.trunk.speed = 25.8224
#Ramp
beam.physsim.network.overwriteRoadTypeProperties.trunkLink.speed = 25.5
beam.physsim.network.overwriteRoadTypeProperties.trunkLink.capacity = 3000
#Super Arterial
beam.physsim.network.overwriteRoadTypeProperties.primary.speed = 27.7
#Ramp
beam.physsim.network.overwriteRoadTypeProperties.primaryLink.speed = 23.7
beam.physsim.network.overwriteRoadTypeProperties.primaryLink.capacity = 4000
#Major Arterial
beam.physsim.network.overwriteRoadTypeProperties.secondary.speed = 27.0
#Ramp
beam.physsim.network.overwriteRoadTypeProperties.secondaryLink.speed = 25.8
beam.physsim.network.overwriteRoadTypeProperties.secondaryLink.capacity = 3000
#Minor Arterial
beam.physsim.network.overwriteRoadTypeProperties.tertiary.speed = 12.0112
#Ramp
beam.physsim.network.overwriteRoadTypeProperties.tertiaryLink.speed = 7.4408
#Local Street
beam.physsim.network.overwriteRoadTypeProperties.residential.speed = 13.4112
#Collector
beam.physsim.network.overwriteRoadTypeProperties.unclassified.speed = 15.6464
beam.physsim.network.overwriteRoadTypeProperties.unclassified.capacity = 3000