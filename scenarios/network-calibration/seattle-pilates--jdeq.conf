include "../../seattle-pilates-base-parquet.conf"

beam.agentsim.simulationName = "sfbay-pilates-network"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.33 # we are simulating 30% of seattle population
beam.agentsim.lastIteration = 12
beam.agentsim.agents.freight.enabled = true

beam.warmStart.type = "disabled"
beam.warmStart.prepareData = true
beam.warmStart.initialLinkstatsFilePath = ""

beam.physsim.flowCapacityFactor = 0.10
#beam.physsim.storageCapacityFactor = 0.5
beam.physsim.storageCapacityFactor = 1.0
beam.physsim.name = "JDEQSim"

beam.agentsim.lastIteration = 3
beam.physsim.name = "JDEQSim"
beam.physsim.relaxation.type = "experiment_2.1"
