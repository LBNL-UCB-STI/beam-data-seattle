include "../../seattle-pilates-base.conf"

beam.agentsim.simulationName = "beam-pilates-run--seattle--2050-BaseFuel-100Elec"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/20260423/2050-BaseFuel-100Elec/payloads--2050-BaseFuel-100Elec.parquet"
  toursFilePath = ${beam.inputDirectory}"/freight/20260423/2050-BaseFuel-100Elec/tours--2050-BaseFuel-100Elec.parquet"
  carriersFilePath = ${beam.inputDirectory}"/freight/20260423/2050-BaseFuel-100Elec/carriers--2050-BaseFuel-100Elec.parquet"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/vehicletypes--frism--2050-BaseFuel-100Elec.csv"
  carrierParkingFilePath = ${beam.inputDirectory}"/parking/seattleUnlimitedTruckParking.csv"
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}

# beam.exchange.output.activity-sim-skimmer.primary.enabled = true
# beam.router.skim.activity-sim-skimmer.fileOutputFormat = "omx"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.33 # we are simulating 30% of seattle population
beam.warmStart.type = "linkStatsOnly"
beam.warmStart.initialLinkstatsFilePath = ${beam.inputDirectory}"/r5/seattle-cbg120-ferry-weakConn-network/2018-baseline-linkstats/5.linkstats.FC07.v3.csv.gz"
beam.physsim.flowCapacityFactor = 0.07
beam.physsim.storageCapacityFactor = 1.0

beam.physsim.jdeqsim.shortLink.storageCapacityOverride {
    minimumLinkLengthThreshold = 10.0
    overriddenNumLanesPerLink = 10.0
}

beam.agentsim.agents.parking.search.params.enableLinkBasedSearch = true
beam.agentsim.agents.parking.search.params.freight.minSearchRadius = 10.0
beam.agentsim.agents.parking.search.params.freight.maxSearchRadius = 1000.0
beam.agentsim.agents.parking.search.params.searchSampleSize = 5000
beam.agentsim.agents.parking.multinomialLogit.params.parkingTypePreferenceMultiplier = 2.0
