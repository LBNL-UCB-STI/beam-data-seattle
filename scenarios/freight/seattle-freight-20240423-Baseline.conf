include "../../seattle-base.conf"

beam.agentsim.simulationName = "seattle-freight-20240423-Baseline"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/2024-04-23/Baseline/freight-merged-payload-plans.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/2024-04-23/Baseline/freight-merged-tours.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/2024-04-23/Baseline/freight-merged-carriers.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/freight-only-vehicletypes--Baseline.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}

beam.exchange.output.activity-sim-skimmer.primary.enabled = true
beam.router.skim.activity-sim-skimmer.fileOutputFormat = "omx"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 1.0 # we are simulating 30% of seattle population
