include "../../seattle-base.conf"

beam.agentsim.simulationName = "seattle-freight-20250721-Baseline-parquet"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/2025-07-21/2018-Baseline/payloads--2018-Baseline.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/2025-07-21/2018-Baseline/tours--2018-Baseline.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/2025-07-21/2018-Baseline/carriers--2018-Baseline.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/ft-vehicletypes--20250721--2018-Baseline.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 30% of total population of tours
}

beam.exchange.output.activity-sim-skimmer.primary.enabled = true
beam.router.skim.activity-sim-skimmer.fileOutputFormat = "omx"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 1.0 # we are simulating 30% of seattle population
beam.exchange.scenario.fileFormat = "parquet"
