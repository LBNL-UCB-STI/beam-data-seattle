include "../../seattle-base.conf"

beam.agentsim.simulationName = "seattle-freight--20250721--2018-Baseline"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/20250721/2018-Baseline/payloads--2018-Baseline.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/20250721/2018-Baseline/tours--2018-Baseline.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/20250721/2018-Baseline/carriers--2018-Baseline.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/vehicleTypes--frism--2018-Baseline.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}

# beam.exchange.output.activity-sim-skimmer.primary.enabled = true
# beam.router.skim.activity-sim-skimmer.fileOutputFormat = "omx"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.33 # we are simulating 30% of seattle population


beam.routing.r5.directory = ${beam.inputDirectory}"/r5/seattle-area-cbg412-ferry-network"
beam.routing.r5.osmMapdbFile = ${beam.inputDirectory}"/r5/seattle-area-cbg412-ferry-network/osm.mapdb"
beam.agentsim.agents.vehicles.linkToGradePercentFilePath = ""
beam.physsim.inputNetworkFilePath = ${beam.inputDirectory}"/r5/seattle-area-cbg412-ferry-network/physsim-network.xml"
beam.warmStart.type = "disabled"