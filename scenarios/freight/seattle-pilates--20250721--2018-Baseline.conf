include "../../seattle-pilates-base.conf"

beam.agentsim.simulationName = "seattle-pilates--20250721--2018-Baseline"
beam.agentsim.lastIteration = 0
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.33 # we are simulating 30% of seattle population

beam.agentsim.agents.freight {
  enabled = true
  carriersFilePath = ${beam.inputDirectory}"/freight/20250721/2018-Baseline/carriers--2018-Baseline.csv"
  plansFilePath = ${beam.inputDirectory}"/freight/20250721/2018-Baseline/payloads--2018-Baseline.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/20250721/2018-Baseline/tours--2018-Baseline.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/vehicletypes--frism--2018-Baseline.csv"
  carrierParkingFilePath = ${beam.inputDirectory}"/parking/seattleUnlimitedTruckParking.csv"
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}
beam.physsim.jdeqsim.shortLink.storageCapacityOverride {
    minimumLinkLengthThreshold = 10.0  # Minimum length threshold (greater than 0) to activate lane override.
    overriddenNumLanesPerLink = 50.0  # Number of lanes to use when overriding the default configuration for short links.
}
beam.warmStart.type = "linkStatsOnly"
beam.warmStart.initialLinkstatsFilePath = ${beam.inputDirectory}"/r5/seattle-cbg120-ferry-weakConn-network/linkstats_v2/6.linkstats.fc07_0.csv.gz"