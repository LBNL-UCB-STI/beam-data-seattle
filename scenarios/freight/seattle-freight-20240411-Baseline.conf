include "../../seattle-base.conf"

beam.agentsim.simulationName = "seattle-freight-20240411-Baseline"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/2024-04-11/Baseline/freight-merged-payload-plans.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/2024-04-11/Baseline/freight-merged-tours.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/2024-04-11/Baseline/freight-merged-carriers.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/freight-only-vehicletypes--Baseline.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}