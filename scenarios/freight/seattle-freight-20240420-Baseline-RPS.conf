include "../../seattle-base.conf"

beam.agentsim.simulationName = "seattle-freight-20240420-Baseline-RPS"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/2024-04-20/2018_Baseline/payloads--2018-Baseline.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/2024-04-20/2018_Baseline/tours--2018-Baseline.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/2024-04-20/2018_Baseline/carriers--2018-Baseline.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/ft-vehicletypes--20240420--2018-Baseline.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}

# beam.exchange.output.activity-sim-skimmer.primary.enabled = true
# beam.router.skim.activity-sim-skimmer.fileOutputFormat = "omx"
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.33 # we are simulating 30% of seattle population


beam.routing.r5.directory = ${beam.inputDirectory}"/r5/r5-residential-partiallysimplified"
beam.routing.r5.osmMapdbFile = ${beam.inputDirectory}"/r5/r5-residential-partiallysimplified/osm.mapdb"
beam.agentsim.agents.vehicles.linkToGradePercentFilePath = ${beam.inputDirectory}"/r5/r5-residential-partiallysimplified/linkToGradePercent.csv"
beam.physsim.inputNetworkFilePath = ${beam.inputDirectory}"/r5/r5-residential-partiallysimplified/physsim-network.xml"
beam.warmStart.type = "disabled"