include "../../seattle-base.conf"

beam.agentsim.simulationName = "seattle-freight-20240420-Baseline-Parking"


beam.agentsim.agents.freight {
  enabled = true
  plansFilePath = ${beam.inputDirectory}"/freight/2024-04-20/2018_Baseline/payloads--2018-Baseline.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/2024-04-20/2018_Baseline/tours--2018-Baseline.csv"
  carriersFilePath = ${beam.inputDirectory}"/freight/2024-04-20/2018_Baseline/carriers--2018-Baseline.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/ft-vehicletypes--20240420--2018-Baseline.csv"
  carrierParkingFilePath = ""
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}

beam.agentsim.agentSampleSizeAsFractionOfPopulation = 0.33 # 30% of total population / 3 to get 10%
beam.agentsim.taz.parkingFilePath = ${beam.inputDirectory}"/parking/seattle-parking.csv"

beam.physsim.events.fileOutputFormats = "csv.gz"
beam.outputs.events.fileOutputFormats = "csv.gz"