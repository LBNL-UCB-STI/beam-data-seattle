include "seattle-base-pilates-parquet.conf"

beam.agentsim.simulationName = "seattle-freight-20250721-Baseline-0.1FlowCap"

beam.agentsim.agents.freight {
  enabled = true
  carriersFilePath = ${beam.inputDirectory}"/freight/2025-07-21/2018_Baseline/carriers--2018-Baseline.csv"
  plansFilePath = ${beam.inputDirectory}"/freight/2025-07-21/2018_Baseline/payloads--2018-Baseline.csv"
  toursFilePath = ${beam.inputDirectory}"/freight/2025-07-21/2018_Baseline/tours--2018-Baseline.csv"
  vehicleTypesFilePath = ${beam.inputDirectory}"/vehicle-tech/ft-vehicletypes--20250721--2018-Baseline.csv"
  carrierParkingFilePath = ${beam.inputDirectory}"/freight/2025-07-21/2018_Baseline/seattleTruckParking07182025.csv"
  isWgs = true
  generateFixedActivitiesDurations = true
  tourSampleSizeAsFractionOfTotal = 1.0 # FRISM is providing 10% of total population of tours
}

beam.routing.writeRoutingStatistic = false

beam.routing.r5.directory = ${beam.inputDirectory}"/r5/seattle-area-cbg412-ferry-network"
beam.routing.r5.osmMapdbFile = ${beam.inputDirectory}"/r5/seattle-area-cbg412-ferry-network/osm.mapdb"
beam.physsim.inputNetworkFilePath = ${beam.inputDirectory}"/r5/seattle-area-cbg412-ferry-network/physsim-network.xml"
beam.agentsim.taz.parkingFilePath = ${beam.inputDirectory}"/parking/taz-parking-minus-downtown-plus.csv.gz"


### CALIBRATION SETUP ###
#beam.warmStart.type = "disabled"
beam.warmStart.type = "linkStatsFromLastRun"
# beam.warmStart.initialLinkstatsFilePath = ${beam.inputDirectory}"/r5/seattle-area-cbg412-ferry-network/init.linkstats.csv.gz"
beam.debug.stuckAgentDetection.enabled = true
beam.debug.stuckAgentDetection {
   checkIntervalMs=200
   checkMaxNumberOfMessagesEnabled=true
   defaultTimeoutMs=60000
   enabled=true
   overallSimulationTimeoutMs=100000
   thresholds=[
       {
           actorTypeToMaxNumberOfMessages {
               population=1
               rideHailAgent=1
               transitDriverAgent=1
           }
           markAsStuckAfterMs=200000 # added 0
           triggerType="beam.agentsim.agents.InitializeTrigger"
       },
       {
           actorTypeToMaxNumberOfMessages {
               population=11
           }
           markAsStuckAfterMs=20000
           triggerType="beam.agentsim.agents.PersonAgent$ActivityEndTrigger"
       },
       {
           actorTypeToMaxNumberOfMessages {
               population=1
           }
           markAsStuckAfterMs=20000
           triggerType="beam.agentsim.agents.PersonAgent$ActivityStartTrigger"
       },
       {
           actorTypeToMaxNumberOfMessages {
               population=20
           }
           markAsStuckAfterMs=20000
           triggerType="beam.agentsim.agents.PersonAgent$PersonDepartureTrigger"
       },
       {
           actorTypeToMaxNumberOfMessages {
               population=20
           }
           markAsStuckAfterMs=20000
           triggerType="beam.agentsim.agents.modalbehaviors.DrivesVehicle$AlightVehicleTrigger"
       },
       {
           actorTypeToMaxNumberOfMessages {
               population=20
           }
           markAsStuckAfterMs=20000
           triggerType="beam.agentsim.agents.modalbehaviors.DrivesVehicle$BoardVehicleTrigger"
       },
       {
           actorTypeToMaxNumberOfMessages {
               population=80
               rideHailAgent=104
               transitDriverAgent=114
           }
           markAsStuckAfterMs=20000
           triggerType="beam.agentsim.agents.modalbehaviors.DrivesVehicle$EndLegTrigger"
       },
       {
           actorTypeToMaxNumberOfMessages {
               population=80
               rideHailAgent=104
               transitDriverAgent=114
           }
           markAsStuckAfterMs=20000
           triggerType="beam.agentsim.agents.modalbehaviors.DrivesVehicle$StartLegTrigger"
       },
       {
           actorTypeToMaxNumberOfMessages {
               transitDriverAgent=1
           }
           markAsStuckAfterMs=20000
           triggerType="beam.agentsim.scheduler.BeamAgentScheduler$KillTrigger"
       }
   ]
}



beamConfig.beam.routing.r5.transitAlternativeList = "OPTIMAL"

beam.agentsim.lastIteration = 3
beam.physsim.name = "JDEQSim"
beam.physsim.relaxation.type = "experiment_2.1"
beam.physsim.relaxation.experiment2_1.internalNumberOfIterations = 3
beam.physsim.relaxation.experiment2_1.fractionOfPopulationToReroute = 0.1
beam.physsim.relaxation.experiment2_1.clearRoutesEveryIteration = true
beam.physsim.relaxation.experiment2_1.clearModesEveryIteration = false
beam.routing.r5.travelTimeNoiseFraction = 0.1

# PhysSim Scaling Params
beam.physsim.flowCapacityFactor = 0.1 #0.135
