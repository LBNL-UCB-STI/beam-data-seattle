beam.warmStart.initialLinkstatsFilePath = ""
beam.routing.r5 {
    directory = ${beam.inputDirectory}"/r5/seattle-area-cbg412-ferry-network"
    osmMapdbFile = ${beam.inputDirectory}"/r5/seattle-area-cbg412-ferry-network/osm.mapdb"
}


beam.agentsim.agents.vehicles.dummySharedCar.vehicleTypeId = "Car"